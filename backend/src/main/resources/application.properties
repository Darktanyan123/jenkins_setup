spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cv_screening}

# Application-specific configuration properties
jwt.secret=${JWT_SECRET:change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload.dir=${APP_UPLOAD_DIR:uploads/resumes}

# Chỉ định phiên bản MongoDB nhúng (khuyến nghị)
de.flapdoodle.mongodb.embedded.version=6.0.5